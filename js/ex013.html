<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
    <style>
        
        html, body {
            height: 100%;
            margin: 0;
        }

        *{
            box-sizing: border-box;
            padding: 0px;
            margin: 0px;
        
        }
        label {
            display: block;
        }

        input{
            margin-bottom: 10px;
            border-radius: 10px;
            width: 300px;
            height: 45px;
            margin-top: 4px;
            text-align: center;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .centralizada {
            display: block;
            justify-content: center; /* Centraliza na horizontal */
            align-items: center;
            background-color: aqua;
            padding: 30px;
            border-radius: 20px;   /* Centraliza na vertical */
        }

        .btnEnviar {
            background-color: blue;
            color: white;
         }

    </style>

</head>
<body>
        <form class="centralizada" id="formulario">
            <label for="nome"> Nome: </label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            
            <label for="email"> E-mail</label>
            <input type="email" name="email" id="email" placeholder="Digite seu e-mail" >

            <label for="idade"> Idade</label>
            <input type="number" name="number" id="number" placeholder="Digite sua idade" >
            
            <label for="senha"> Senha </label>
            <input type="password" name="senha" id="senha" placeholder="Digite sua senha" >
                
            <br>

            <input class="btnEnviar" type="submit" value="Enviar">
        </form>


        <script>
            let form = document.getElementById('formulario')
            form.addEventListener('submit', function(event){
             
                event.preventDefault()
                console.log(event)
                let nome = document.getElementById('nome').value
                alert(`Ola ${nome} submitted`)
            }
               )

             
            
        </script>

    </div>
</body>
</html>
