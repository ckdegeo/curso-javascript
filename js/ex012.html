<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Somando valores</h1>
 
    <input type="number" id="numero1"> +
    <input type="number" id="numero2"> 

    <input type="button" value="Somar" id="botao">

    <p id="res"> Resultado</p>

    <script>

    let botaoSomar = document.getElementById('botao')

    botaoSomar.addEventListener('click', somarValores)

        function somarValores(){
            console.log("Está na função")
            let numero1 = document.getElementById('numero1').value
            let numero2 = document.getElementById('numero2').value
        

            let soma = Number(numero1) + Number(numero2)

            console.log(soma)
            
            document.getElementById('res').innerHTML = `O resultado da soma é: ${soma}`
       
        if (soma > 100) {
            document.getElementById('res').style.backgroundColor = 'green'

        }else {
              document.getElementById('res').style.backgroundColor = 'red'
        }

    }


    </script>
</body>
</html>
