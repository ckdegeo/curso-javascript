<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Classe</title>
    <style>
        div {
            background-color: lightpink;
            width: 200px;
            height: 200px;
            justify-content: center;
            display: flex;
            align-items: center;
            margin: 10px;
        }

        .class1:hover{
            background-color: green;
        }
        .class2:hover{
            background-color: red;
        }
        .class3:hover{
            background-color: blue;
        }
        
            

    </style>
</head>

<body>

    <div class="class1">01</div>
    <div class="class2">02</div>
    <div class="class3">03</div>

</body>

</html>
